[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "barrier-tft"
version = "0.1.0"
description = "Cross-sectional TFT + FinBERT short-horizon equity forecaster"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["quantitative-finance", "deep-learning", "temporal-fusion-transformer", "finbert"]

dependencies = [
    "torch>=2.13.0",
    "numpy>=2.5.2",
    "pandas>=3.0.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "lightgbm>=4.6.0",
    "transformers>=4.40.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "tqdm>=4.66.4",
    "pandera>=0.19.0",
    "mlflow>=2.14.0",
    "joblib>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths   = ["tests"]
addopts     = "-v --tb=short"
filterwarnings = [
    "ignore",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.mypy]
python_version  = "3.11"
strict          = false
ignore_missing_imports = true
files           = ["src"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "sklearn.*", "scipy.*", "pandera.*", "mlflow.*"]
ignore_missing_imports = true
